name: DeskAPI

services:
  desk-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DESK_POSTGRES_USER:?DESK_POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${DESK_POSTGRES_PASSWORD:?DESK_POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${DESK_POSTGRES_DB:?DESK_POSTGRES_DB must be set}
    volumes: [desk-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "5432:5432"

  desk-service:
    build:
      context: .
      dockerfile: desk-service/Dockerfile
    image: desk-service:latest
    restart: unless-stopped
    depends_on:
      desk-db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: desk-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${DESK_POSTGRES_DB:?DESK_POSTGRES_DB must be set}
      POSTGRES_USER: ${DESK_POSTGRES_USER:?DESK_POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${DESK_POSTGRES_PASSWORD:?DESK_POSTGRES_PASSWORD must be set}
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  desk-db-data:


