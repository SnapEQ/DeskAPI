spring:
  application:
    name: desk-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

server:
  port: 8080

desk:
  time-zone: ${DESK_TIME_ZONE:Europe/Warsaw}

management:
  endpoint:
    health:
      probes:
        enabled: true
