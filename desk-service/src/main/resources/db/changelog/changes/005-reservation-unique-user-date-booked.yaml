databaseChangeLog:
  - changeSet:
      id: 005-reservation-unique-user-date-booked
      author: WojciechBinkowski
      changes:
        - sql:
            sql: |
              CREATE UNIQUE INDEX uq_reservation_user_date_booked
              ON reservation (user_id, reservation_date)
              WHERE status = 'BOOKED'
      rollback:
        - sql:
            sql: DROP INDEX uq_reservation_user_date_booked
